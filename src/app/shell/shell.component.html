<header class="ml-header">
  <div class="ml-header-main">
    <a routerLink="/dashboard" class="ml-brand">
      <img src="/LogoPriceWatch.png" class="ml-logo" alt="PriceWatch">
    </a>
    <div class="ml-search-box">
      <input type="text"
             [value]="searchQuery()"
             [placeholder]="'NAV.SEARCH_PLACEHOLDER' | translate"
             (input)="searchQuery.set($any($event.target).value)"
             (keydown.enter)="goToItems()">
      <button type="button" (click)="goToItems()">
        <mat-icon>search</mat-icon>
      </button>
    </div>
    <div class="ml-user-bar">
      <button mat-button class="ml-user-btn" (click)="toggleLang()" [title]="lang.current()">
        <mat-icon>translate</mat-icon>
      </button>
      <a mat-button class="ml-user-btn" routerLink="/profile">
        <mat-icon>account_circle</mat-icon>
        <span>{{ 'NAV.PROFILE' | translate }}</span>
      </a>
      <button mat-button class="ml-user-btn" (click)="logout()">{{ 'NAV.LOGOUT' | translate }}</button>
    </div>
  </div>

  <nav class="ml-header-nav">
    <div class="ml-nav-inner">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
        {{ 'NAV.DASHBOARD' | translate }}
      </a>
      <a routerLink="/lists" routerLinkActive="active">{{ 'NAV.LISTS' | translate }}</a>
      <a routerLink="/items" routerLinkActive="active">{{ 'NAV.ITEMS' | translate }}</a>
      <a routerLink="/notifications" routerLinkActive="active">
        {{ 'NAV.NOTIFICATIONS' | translate }}
        @if (polling.unreadCount() > 0) {
          <span class="ml-notif-badge">{{ polling.unreadCount() }}</span>
        }
      </a>
    </div>
  </nav>
</header>

<main class="shell-content">
  <div class="shell-container">
    <router-outlet />
  </div>
</main>
